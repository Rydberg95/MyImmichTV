<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Immich TV Remote</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="pair" class="pair hidden">
  <h1>My Immich TV</h1>
  <p class="muted">Enter the PIN shown on your TV</p>
  <form id="pairForm">
    <input id="pinInput" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000">
    <button type="submit">Pair</button>
  </form>
  <p id="pairError" class="error"></p>
</div>
<div id="setup" class="pair hidden">
  <h1>Set up My Immich TV</h1>
  <p class="muted">Type your server details — the TV does the rest</p>
  <form id="setupForm">
    <input id="setupPin" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="PIN from TV">
    <input id="setupUrl" type="url" autocomplete="off" placeholder="https://immich.example.lan">
    <input id="setupKey" type="password" autocomplete="off" placeholder="API key (Immich > Settings > API Keys)">
    <button type="submit">Connect TV</button>
  </form>
  <div id="setupCert" class="cert hidden">
    <p>Self-signed certificate detected.<br>Verify this SHA-256 fingerprint:</p>
    <code id="setupFp"></code>
    <div class="row">
      <button id="setupTrust" class="primary">It matches — trust it</button>
      <button id="setupCancel">Cancel</button>
    </div>
  </div>
  <p id="setupStatus" class="muted"></p>
  <p id="setupError" class="error"></p>
</div>
<div id="app" class="app hidden">
  <header>
    <div class="brand">My Immich TV</div>
    <div class="now" id="nowPlaying"></div>
    <div class="conn" id="connState"><span class="dot"></span> TV</div>
  </header>
  <nav id="tabs">
    <button data-tab="timeline" class="active">Timeline</button>
    <button data-tab="favorites">Favorites</button>
    <button data-tab="albums">Albums</button>
    <button data-tab="search">Search</button>
  </nav>
  <div id="mainwrap">
    <main id="content"></main>
    <div id="rail" class="rail hidden">
      <div class="rail-ticks"></div>
      <div class="rail-track"></div>
      <div class="rail-thumb"><span class="rail-bubble"></span></div>
    </div>
  </div>
  <footer>
    <button id="btnPrev" title="Previous">⏮</button>
    <button id="btnPlay" title="Slideshow">▶</button>
    <button id="btnNext" title="Next">⏭</button>
    <button id="btnShuffle" title="Shuffle">🔀</button>
    <button id="btnInfo" title="Info">ℹ</button>
    <button id="btnSettings" title="Settings">⚙</button>
  </footer>
</div>
<div id="settingsSheet" class="sheet hidden">
  <div class="sheet-panel">
    <h2>Settings</h2>
    <label class="set-label" for="viewerInterval">Slideshow interval (viewing)</label>
    <div class="row-num">
      <input id="viewerInterval" type="number" min="3" max="120" step="1" inputmode="numeric">
      <span class="muted">seconds</span>
    </div>
    <label class="set-label" for="dreamInterval">Screensaver interval</label>
    <div class="row-num">
      <input id="dreamInterval" type="number" min="5" max="300" step="1" inputmode="numeric">
      <span class="muted">seconds</span>
    </div>
    <label class="set-label" for="dreamSource">Screensaver source</label>
    <p class="muted small">What the screensaver shows; applies the next time it starts.</p>
    <select id="dreamSource"></select>
    <label class="chk">
      <input type="checkbox" id="dreamVideos">
      Include videos in the screensaver (plays with sound)
    </label>
    <p id="settingsStatus" class="muted small"></p>
    <button id="settingsClose" class="primary">Done</button>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
